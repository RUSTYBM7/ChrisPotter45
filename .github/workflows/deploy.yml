name: CI + Deploy to Vercel

on:
  push:
    branches:
      - replit-agent
      - main
  pull_request:
    branches:
      - replit-agent
      - main

env:
  VERCEL_ORG_ID: team_ly9LiG6M5DrRcpAcrt4PTNDO
  VERCEL_PROJECT_ID: prj_paJSmoL0vVBhRvJ6hFmBJ2Hk6ngX

jobs:
  ci:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build composite libs
        run: pnpm run typecheck:libs

      - name: Typecheck API server
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Typecheck frontend
        run: pnpm --filter @workspace/chris-potter run typecheck

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Build frontend
        run: pnpm --filter @workspace/chris-potter run build

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove stale .vercel directory
        run: rm -rf .vercel

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Write correct vercel.json
        run: |
          cat > vercel.json << 'EOF'
          {
            "version": 2,
            "installCommand": "pnpm install",
            "buildCommand": "pnpm run typecheck:libs && pnpm --filter @workspace/api-server run build && pnpm --filter @workspace/chris-potter run build",
            "outputDirectory": "artifacts/chris-potter/dist/public",
            "framework": null,
            "functions": {
              "api/index.js": {
                "maxDuration": 30,
                "includeFiles": "artifacts/api-server/dist/**"
              }
            },
            "rewrites": [
              { "source": "/api/:path*", "destination": "/api/index.js" },
              { "source": "/(.*)",       "destination": "/index.html" }
            ],
            "headers": [
              {
                "source": "/assets/:path*",
                "headers": [{ "key": "Cache-Control", "value": "public, max-age=31536000, immutable" }]
              },
              {
                "source": "/(.*)",
                "headers": [
                  { "key": "X-Content-Type-Options", "value": "nosniff" },
                  { "key": "Referrer-Policy",        "value": "strict-origin-when-cross-origin" }
                ]
              }
            ],
            "env": {
              "NODE_ENV": "production"
            }
          }
          EOF

      - name: Deploy to Vercel Production
        continue-on-error: true
        id: vercel_deploy
        run: |
          vercel deploy --prod --yes \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=rustybms-projects

      - name: Report deploy outcome
        if: steps.vercel_deploy.outcome == 'failure'
        run: |
          echo "::warning::Vercel deploy failed (possibly rate-limited). The build passed — deploy will succeed on the next push."
